name: Retag (repoint a tag to an existing image)

# 用途：把某个 tag 重新指向仓库里**已经存在**的镜像（例如历史上被贴错的 `:911275c…`）。
# 只改指向、不重新构建，所以很快。目标 tag 的历史镜像不会被删（GHCR 仍保留旧的 manifest）。
#
# 安全闸：
#   · 不允许把 `latest` 当目标（线上拉取目标只能由 build-image 的 Promote 步骤动）
#   · 源必须是不可变 tag（`sha-<commit>`），避免把某个浮动 tag 的当前指向误复制过去
#   · 改前/改后都打印 digest，并**断言目标 digest 与源逐字一致**（B7）：
#     digest 是内容寻址的，相等 ⇒ 只改了指向、没换内容；不一致就 fail（并把两个 digest 都打出来）。
#     若目标本来就指向同一个 digest 则幂等短路、不做无谓写入。
#
# 分支构建风险核对（2026-10-01，配合 build-image 新增的 push: test/*）：
#   本 workflow **只有 `workflow_dispatch` 一种触发**（没有 push / pull_request），
#   所以推 test/* 分支**不会**触发它；即便有人手动从任意 ref 派发，它也：
#     ① 拒绝把 `latest` 当目标（校验输入那步硬拦），② 只接受 sha-* 源、③ 逐字校验 digest。
#   结论：它无法把线上在用的 `latest` 顶成测试版 —— 无需再加 master-only 守卫
#   （加了反而会挡住"从任一 ref 手工修复历史上贴错的不可变 tag"这个正当用途）。
#   `latest` 的唯一改动者仍只有 build-image 的 Promote 步骤（已限定 github.ref == refs/heads/master）。

on:
  workflow_dispatch:
    inputs:
      from_tag:
        description: '源 tag（必须是已存在的不可变 tag，例如 sha-3a1136c924c42eaf4dc23203d8f09163fc4ea063）'
        required: true
      to_tag:
        description: '目标 tag（例如 911275c13b038c7a8b710de44664f23887eeb6f6；不允许 latest）'
        required: true

permissions:
  contents: read
  packages: write

concurrency:
  group: retag-${{ github.ref }}
  cancel-in-progress: false

jobs:
  retag:
    runs-on: ubuntu-latest
    steps:
      - name: 校验输入
        env:
          FROM: ${{ inputs.from_tag }}
          TO: ${{ inputs.to_tag }}
        run: |
          set -euo pipefail
          if [ "$TO" = "latest" ]; then
            echo "::error::不允许把 latest 当目标（线上拉取目标只能由 build-image 的 Promote 步骤动）"
            exit 1
          fi
          case "$TO" in
            *:*) echo "::error::目标 tag 里不能带冒号"; exit 1;;
          esac
          case "$FROM" in
            sha-*) ;;
            *) echo "::error::源必须是不可变 tag（sha-<commit>）"; exit 1;;
          esac
          echo "把 :${FROM} 指向的镜像同时打上 :${TO}"

      - name: Login to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Retag（改前/改后校验源与目标 digest 一致）
        env:
          FROM: ${{ inputs.from_tag }}
          TO: ${{ inputs.to_tag }}
        run: |
          set -euo pipefail
          IMAGE="ghcr.io/mole404/lsky-pro-docker"
          # 注意：本步骤带 set -o pipefail，`cmd | head` 会因 SIGPIPE 退出 255 把整步搞红
          # （这个坑以前踩过）→ 一律先写文件、再 head，不把 inspect 接到 head/grep 的管道里。
          #
          # 取某 tag 的**顶层 digest**（multi-arch 时就是 index 的 digest）。取不到返回非 0。
          digest_of() { # $1=tag  $2=落盘文件
            docker buildx imagetools inspect "${IMAGE}:$1" > "$2" 2>&1
          }

          echo "== 改前：:${TO} =="
          BEFORE=""
          if digest_of "$TO" /tmp/before.txt; then
            BEFORE=$(awk '$1=="Digest:"{print $2; exit}' /tmp/before.txt)
            head -6 /tmp/before.txt || true
            echo "改前 :${TO} digest = ${BEFORE:-（未解析到）}"
          else
            echo "（:${TO} 当前不存在）"
            head -6 /tmp/before.txt || true
          fi

          echo "== 源：:${FROM} =="
          if ! digest_of "$FROM" /tmp/from.txt; then
            echo "::error::取不到源 :${FROM} 的 digest —— 源 tag 不存在或无法访问"
            head -20 /tmp/from.txt || true
            exit 1
          fi
          head -6 /tmp/from.txt || true
          SRC_DIGEST=$(awk '$1=="Digest:"{print $2; exit}' /tmp/from.txt)
          if ! [[ "$SRC_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::源 :${FROM} 的 digest 格式不对（解析到：'$SRC_DIGEST'）"
            head -20 /tmp/from.txt || true
            exit 1
          fi
          echo "源 :${FROM} digest = $SRC_DIGEST"

          # 幂等短路：目标已经是同一个 digest（内容一致）就没必要再改
          if [ -n "$BEFORE" ] && [ "$BEFORE" = "$SRC_DIGEST" ]; then
            echo "::notice:::${TO} 已指向 $SRC_DIGEST（与源一致），无需变更"
            exit 0
          fi

          docker buildx imagetools create -t "${IMAGE}:${TO}" "${IMAGE}:${FROM}"

          echo "== 改后：:${TO} =="
          if ! digest_of "$TO" /tmp/after.txt; then
            echo "::error::retag 之后读不到 :${TO} 的 digest —— retag 可能没生效"
            head -20 /tmp/after.txt || true
            exit 1
          fi
          head -6 /tmp/after.txt || true
          DST_DIGEST=$(awk '$1=="Digest:"{print $2; exit}' /tmp/after.txt)

          # 核心断言：目标 digest 必须**逐字等于**源 digest。
          # digest 是内容寻址的（同一 digest ⇒ 同一份内容），相等即证明 retag 只改指向、没换内容。
          # 不一致必须失败 —— 否则等于把一个「和源不同」的镜像悄悄挂到该 tag 上。
          if [ "$DST_DIGEST" != "$SRC_DIGEST" ]; then
            echo "::error::retag 源/目标 digest 不一致！"
            echo "  源   :${FROM} = $SRC_DIGEST"
            echo "  目标 :${TO} = $DST_DIGEST"
            echo "--- 源 :${FROM} 完整 inspect ---"; cat /tmp/from.txt || true
            echo "--- 目标 :${TO} 完整 inspect ---"; cat /tmp/after.txt || true
            exit 1
          fi
          echo "✅ digest 校验通过：:${TO} 与源 :${FROM} 内容一致（$SRC_DIGEST）"
          {
            echo "## Retag digest 校验"
            echo ""
            echo "- 源   \`:${FROM}\` = \`$SRC_DIGEST\`"
            echo "- 目标 \`:${TO}\` = \`$DST_DIGEST\`（改前：${BEFORE:-不存在}）"
            echo "- 结论：一致 ✅"
          } >> "$GITHUB_STEP_SUMMARY"
