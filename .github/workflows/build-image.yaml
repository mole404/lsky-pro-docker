name: Build and push image to GHCR

# 上游 workflow 是「每天定时拉 master 重新构建并推到 DockerHub」，本 fork 改成：
#   - 只在 master 有推送时构建（源码已钉死，定时重建没有意义）
#   - 推到 GHCR，用仓库自带的 GITHUB_TOKEN，不需要任何 secret
#   - 先推到不可变的 sha tag → 真机自证 → 自证通过才把 latest 指过去
#     这样自证失败时 latest 仍停在上一个已知可用的镜像，线上拉到的不会是坏版本
on:
  push:
    branches:
      - master
  workflow_dispatch:

env:
  TZ: Asia/Shanghai
  IMAGE: ghcr.io/mole404/lsky-pro-docker
  # 与 Dockerfile 里的 LSKY_COMMIT 保持一致，用于打第二个可追溯的 tag
  LSKY_COMMIT: 911275c13b038c7a8b710de44664f23887eeb6f6
  # 补丁后 context-js.js 的 md5（Dockerfile 里也断言了同一份）
  CONTEXT_JS_MD5: 528d32fc5adc0d306b6d8f773ee5caaf
  # 补丁后 images.blade.php 的 md5（blade 里改了资源版本串就会变）
  BLADE_MD5: 576929df685fdb93f9950c16d924bcdc

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 只推不可变 tag；latest 由最后的 Promote 步骤在自证通过后才指过来
      - name: Build and push (linux/amd64, linux/arm64)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE }}:sha-${{ github.sha }}
          build-args: |
            FORK_SHA=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ------------------------------------------------------------------
      # 自证：不只看「构建成功」，而是把推上去的镜像拉回来实测
      #   1. 核对补丁文件 md5（确认 overlay 真的进了镜像）
      #   2. 记录 PHP / 扩展 / Debian / ImageMagick 版本（换基础镜像时的对比基线）
      #   3. 关键扩展硬断言（pdo_sqlite 缺了线上 SQLite 站点直接挂）
      #   4. 真起一个容器 curl 首页，确认 Apache + PHP + 应用真的能跑
      # 注意：本段整体被外层单引号包着（sh -c '...'），里面只能出现双引号，
      #       写单引号会把脚本提前截断 → syntax error near unexpected token `('
      # ------------------------------------------------------------------
      - name: Verify published image
        env:
          IMAGE_REF: ${{ env.IMAGE }}:sha-${{ github.sha }}
        run: |
          set -euo pipefail

          docker pull "$IMAGE_REF"

          REPORT=$(docker run --rm --entrypoint sh "$IMAGE_REF" -c '
            set -e
            echo "== /etc/os-release =="
            grep -E "^(PRETTY_NAME|VERSION_ID)=" /etc/os-release
            echo "== php -v（含启动警告）=="
            php -v 2>&1 | head -3
            echo "== php -m =="
            php -m | sort | tr "\n" " "; echo
            echo "== 关键扩展断言 =="
            for ext in pdo_sqlite sqlite3 imagick redis pdo_mysql bcmath; do
              if php -m | grep -qix "$ext"; then echo "$ext=1"; else echo "$ext=0"; fi
            done
            echo "== opcache 加载情况排查 =="
            echo -n "php -m 里匹配 opcache 的行数："
            php -m | grep -ci opcache || true
            echo "-- conf.d 下的 ini --"
            ls /usr/local/etc/php/conf.d/
            echo "-- 含 zend_extension 的 ini 内容 --"
            grep -rn zend_extension /usr/local/etc/php/conf.d/ || true
            echo "-- php -m 里段头与 opcache 的行号（判断是重复加载还是分段显示）--"
            php -m | grep -n -e "^\[" -e opcache || true
            echo "-- php --ini --"
            php --ini
            echo "== apache2 -v =="
            apache2 -v | head -1
            echo "== imagick =="
            php -r "print_r(Imagick::getVersion());" 2>/dev/null | tr -d "\n" | head -c 300; echo
            echo "== 长按阈值 =="
            grep -n "LONG_PRESS_DELAY = " /var/www/lsky/public/js/context-js/context-js.js
            echo "== 补丁文件 md5 =="
            md5sum /var/www/lsky/public/js/context-js/context-js.js
            md5sum /var/www/lsky/resources/js/context-js.js
            md5sum /var/www/lsky/resources/views/user/images.blade.php
            echo "== 应用入口 =="
            ls -l /var/www/lsky/public/index.php
          ')
          echo "$REPORT"

          ACTUAL=$(echo "$REPORT" | awk '/context-js\/context-js.js$/ {print $1}')
          if [ "$ACTUAL" != "${CONTEXT_JS_MD5}" ]; then
            echo "::error::镜像里的 context-js.js（$ACTUAL）与预期补丁（${CONTEXT_JS_MD5}）不一致"
            exit 1
          fi
          echo "补丁文件 md5 校验通过：$ACTUAL"

          # blade 也要核：它决定浏览器拿到的资源版本串，漏了就白改
          BLADE_ACTUAL=$(echo "$REPORT" | awk '/user\/images.blade.php$/ {print $1}')
          if [ "$BLADE_ACTUAL" != "${BLADE_MD5}" ]; then
            echo "::error::镜像里的 images.blade.php（$BLADE_ACTUAL）与预期（${BLADE_MD5}）不一致"
            exit 1
          fi
          echo "blade md5 校验通过：$BLADE_ACTUAL"

          # 长按阈值必须是 250ms（老师要求 500 -> 250）
          if ! echo "$REPORT" | grep -q 'LONG_PRESS_DELAY = 250'; then
            echo "::error::补丁里的长按阈值不是 250ms"
            exit 1
          fi
          echo "长按阈值 250ms 校验通过"

          # 线上是 SQLite 数据库，扩展缺失会让站点直接挂，钉死这条断言
          if ! echo "$REPORT" | grep -q pdo_sqlite=1; then
            echo "::error::新镜像里 pdo_sqlite 没加载（线上是 SQLite 数据库，不能丢）"
            exit 1
          fi
          echo "关键扩展断言通过（pdo_sqlite / sqlite3 等）"

          # 真起一次容器：默认 8089 端口，入口脚本会把应用播种到 /var/www/html
          docker run -d --name lsky-smoke -p 18089:8089 -e WEB_PORT=8089 "$IMAGE_REF"
          CODE=000
          for i in $(seq 1 30); do
            CODE=$(curl -s -L -o /tmp/install.html -w '%{http_code}' http://127.0.0.1:18089/install || true)
            [ "$CODE" = "200" ] && break
            sleep 2
          done
          echo "安装页 HTTP 状态：$CODE"
          if [ "$CODE" != "200" ]; then
            docker logs lsky-smoke || true
            echo "::error::容器起来了但安装页返回 $CODE"
            exit 1
          fi
          curl -s -o /tmp/root.html -w 'GET / → %{http_code}\n' -L http://127.0.0.1:18089/
          docker exec lsky-smoke php -r 'echo "artisan 可用："; echo file_exists("/var/www/html/artisan") ? "yes" : "no"; echo PHP_EOL;'
          echo "== 播种到卷里的补丁文件（部署后真正被 Apache 读的那份）=="
          docker exec lsky-smoke md5sum /var/www/html/public/js/context-js/context-js.js
          docker rm -f lsky-smoke

          {
            echo "## 镜像自证（linux/amd64）"
            echo ""
            echo '```'
            echo "$REPORT"
            echo "安装页 HTTP：$CODE"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # ------------------------------------------------------------------
      # 代码同步自证（数据安全关键路径；按镜像版本标记条件触发）
      #   A) 空卷：必须播种；且绝不能把镜像里的 .env 带进空卷
      #      （实测踩过：带进去了 → Lsky 安装向导 500，全新建站直接挂）
      #   B) 已有卷 + 旧版本标记：代码必须同步成镜像版本，.env / database /
      #      storage / bootstrap/cache 一个都不许被碰，编译视图缓存要清
      #   C) 已有卷 + 同版本标记：必须跳过同步（不白写整棵应用树，手动修补保留）
      # 任何一条不满足就 exit 1 —— 自证不过就不会 promote latest。
      # ------------------------------------------------------------------
      - name: Verify code sync (revision-gated) and data safety
        env:
          IMAGE_REF: ${{ env.IMAGE }}:sha-${{ github.sha }}
        run: |
          set -euo pipefail
          VOL=lsky-sync-test
          docker rm -f lsky-a lsky-b lsky-c >/dev/null 2>&1 || true
          docker volume rm -f "$VOL" >/dev/null 2>&1 || true

          echo "== A) 空卷首次启动：应播种，且卷里不能出现 .env =="
          docker run -d --name lsky-a -v "$VOL":/var/www/html -e WEB_PORT=8089 "$IMAGE_REF"
          A=000
          for i in $(seq 1 30); do
            A=$(docker exec lsky-a sh -c 'curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:8089/install || true' 2>/dev/null || true)
            [ "$A" = "200" ] && break
            sleep 2
          done
          echo "全新建站安装页 HTTP：$A"
          if [ "$A" != "200" ]; then
            docker logs lsky-a || true
            echo "::error::空卷播种后安装页不是 200（HTTP $A）"
            exit 1
          fi
          docker exec lsky-a sh -c '
            echo "IDX=$(test -f /var/www/html/public/index.php && echo yes || echo no)"
            echo "ENVFILE=$(test -e /var/www/html/.env && echo present || echo absent)"
            echo "MARKER=$(head -1 /var/www/html/.code-revision 2>/dev/null || echo none)"
          '
          if [ "$(docker exec lsky-a sh -c 'test -e /var/www/html/.env && echo present || echo absent')" != "absent" ]; then
            echo "::error::空卷里出现了镜像的 .env —— 这正是会让安装向导 500 的坑"
            exit 1
          fi
          docker exec lsky-a test -f /var/www/html/.code-revision || { echo "::error::空卷里没有版本标记"; exit 1; }
          echo "A) 通过：空卷已播种、无 .env、有版本标记、安装页 200"
          docker rm -f lsky-a >/dev/null

          echo "== B) 已有卷 + 旧版本标记：应自动同步代码，数据与配置一项都不许变 =="
          docker run --rm -v "$VOL":/var/www/html --entrypoint sh "$IMAGE_REF" -c '
            set -e
            echo "fork_sha=STALE" > /var/www/html/.code-revision
            echo "// OLD cached js" > /var/www/html/public/js/context-js/context-js.js
            echo "<?php // 手动修补过" > /var/www/html/app/Services/ImageService.php
            printf "APP_KEY=SENTINEL_KEEP_ME\n" >> /var/www/html/.env
            chmod 640 /var/www/html/.env
            mkdir -p /var/www/html/database /var/www/html/storage/framework/views /var/www/html/storage/app/uploads /var/www/html/bootstrap/cache
            echo "SENTINEL_DB" > /var/www/html/database/database.sqlite
            echo "SENTINEL_UPLOAD" > /var/www/html/storage/app/uploads/keepme.txt
            echo "SENTINEL_COMPILED_VIEW" > /var/www/html/storage/framework/views/deadbeef.php
            echo "SENTINEL_CONFIG_CACHE" > /var/www/html/bootstrap/cache/config.php
          '

          docker run -d --name lsky-b -v "$VOL":/var/www/html -e WEB_PORT=8089 "$IMAGE_REF"
          for i in $(seq 1 30); do
            if docker exec lsky-b md5sum /var/www/html/public/js/context-js/context-js.js 2>/dev/null | grep -q "$CONTEXT_JS_MD5"; then break; fi
            sleep 2
          done
          docker logs lsky-b 2>&1 | grep '\[lsky\]' || true
          docker logs lsky-b 2>&1 | grep -q '已同步进卷' || { echo "::error::旧标记时没有走同步分支"; exit 1; }

          B=$(docker exec lsky-b sh -c '
            echo "JS_MD5=$(md5sum /var/www/html/public/js/context-js/context-js.js | cut -d" " -f1)"
            echo "BLADE_MD5=$(md5sum /var/www/html/resources/views/user/images.blade.php | cut -d" " -f1)"
            echo "HANDBOOK_GONE=$(grep -c 手动修补过 /var/www/html/app/Services/ImageService.php || true)"
            echo "ENV_SENTINEL=$(grep -c SENTINEL_KEEP_ME /var/www/html/.env || true)"
            echo "ENV_MODE=$(stat -c %a /var/www/html/.env)"
            echo "DB_SENTINEL=$(cat /var/www/html/database/database.sqlite)"
            echo "UPLOAD_SENTINEL=$(cat /var/www/html/storage/app/uploads/keepme.txt)"
            echo "CONFIG_CACHE=$(cat /var/www/html/bootstrap/cache/config.php)"
            echo "COMPILED_VIEWS=$(ls /var/www/html/storage/framework/views/ | wc -l)"
          ')
          echo "$B"
          echo "$B" | grep -q "JS_MD5=${CONTEXT_JS_MD5}"           || { echo "::error::已有卷里的补丁 JS 没被同步成镜像版本"; exit 1; }
          echo "$B" | grep -q "BLADE_MD5=${BLADE_MD5}"             || { echo "::error::已有卷里的 blade 没被同步"; exit 1; }
          echo "$B" | grep -q "HANDBOOK_GONE=0"                    || { echo "::error::旧版本的手工改动没被同步覆盖（换镜像应等于换代码）"; exit 1; }
          echo "$B" | grep -q "ENV_SENTINEL=1"                     || { echo "::error::.env 被覆盖了（会丢 APP_KEY / S3 配置）"; exit 1; }
          echo "$B" | grep -q "ENV_MODE=640"                       || { echo "::error::.env 的权限位被改了"; exit 1; }
          echo "$B" | grep -q "DB_SENTINEL=SENTINEL_DB"            || { echo "::error::数据库文件被覆盖了"; exit 1; }
          echo "$B" | grep -q "UPLOAD_SENTINEL=SENTINEL_UPLOAD"    || { echo "::error::上传文件被覆盖了"; exit 1; }
          echo "$B" | grep -q "CONFIG_CACHE=SENTINEL_CONFIG_CACHE" || { echo "::error::bootstrap/cache 被动过"; exit 1; }
          echo "$B" | grep -q "COMPILED_VIEWS=0"                   || { echo "::error::编译视图缓存没清，blade 改动不会生效"; exit 1; }
          echo "B) 通过：代码已同步，.env / 数据库 / 上传 / 配置缓存均未被碰，视图缓存已清"

          echo "== C) 已有卷 + 同版本标记：必须跳过同步（手动修补保留）=="
          docker rm -f lsky-b >/dev/null
          docker run --rm -v "$VOL":/var/www/html --entrypoint sh "$IMAGE_REF" -c 'echo "<?php // 手动修补过" > /var/www/html/app/Services/ImageService.php'
          docker run -d --name lsky-c -v "$VOL":/var/www/html -e WEB_PORT=8089 "$IMAGE_REF"
          for i in $(seq 1 20); do
            docker logs lsky-c 2>&1 | grep -q '\[lsky\]' && break
            sleep 1
          done
          docker logs lsky-c 2>&1 | grep '\[lsky\]' || true
          docker logs lsky-c 2>&1 | grep -q '跳过同步' || { echo "::error::同版本标记时应跳过同步"; exit 1; }
          C=$(docker exec lsky-c sh -c '
            echo "HANDBOOK_KEPT=$(grep -c 手动修补过 /var/www/html/app/Services/ImageService.php || true)"
            echo "SERVED_JS=$(curl -s http://127.0.0.1:8089/js/context-js/context-js.js | md5sum | cut -d" " -f1)"
          ')
          echo "$C"
          echo "$C" | grep -q "HANDBOOK_KEPT=1"            || { echo "::error::同版本时手动修补被覆盖了（不该同步）"; exit 1; }
          echo "$C" | grep -q "SERVED_JS=${CONTEXT_JS_MD5}" || { echo "::error::跳过后对外服务的 JS 不是补丁版"; exit 1; }
          echo "C) 通过：同版本跳过同步、手动修补保留、对外服务的 JS 仍是补丁版"

          echo "== 同步开销（只在标记不一致时发生）=="
          docker run --rm --entrypoint sh "$IMAGE_REF" -c 'du -sh /var/www/lsky; cd /var/www/lsky && time tar cf - --exclude=./.env --exclude=./storage --exclude=./database --exclude=./bootstrap/cache --exclude=./public/i . > /dev/null'
          docker rm -f lsky-c >/dev/null 2>&1 || true
          docker volume rm -f "$VOL" >/dev/null 2>&1 || true

      # 自证全过之后才动 latest：验证失败时 latest 保持在上一个已知可用版本
      - name: Promote verified image to latest
        run: |
          set -euo pipefail
          docker buildx imagetools create \
            -t "${IMAGE}:latest" \
            -t "${IMAGE}:${LSKY_COMMIT}" \
            "${IMAGE}:sha-${GITHUB_SHA}"
          echo "已把 sha-${GITHUB_SHA} 提升为 :latest 与 :${LSKY_COMMIT}"
          docker buildx imagetools inspect "${IMAGE}:latest" > /tmp/promoted.txt
          head -20 /tmp/promoted.txt
