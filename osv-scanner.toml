# -----------------------------------------------------------------------------
# 3) maximebf/debugbar v1.18.2 —— **开发依赖**（packages-dev）
#    Dockerfile 用 `composer install --no-dev` 构建镜像 → 不随镜像发布。
#    命中的两条其实是它捆绑的 jQuery 的 XSS（CVE-2019-11358 / CVE-2020-11022），
#    对「镜像里有没有这个东西」无影响。
# -----------------------------------------------------------------------------
[[IgnoredVulns]]
id = "GHSA-6c3j-c64m-qhgq"        # CVE-2019-11358：jQuery 原型污染 XSS（debugbar 捆绑）
ignoreUntil = 2027-06-30
reason = "maximebf/debugbar 是 packages-dev 开发依赖，镜像用 --no-dev 构建 → 不进镜像；命中为捆绑的旧 jQuery"

[[IgnoredVulns]]
id = "GHSA-gxr4-xjj5-5px2"        # CVE-2020-11022：jQuery XSS（debugbar 捆绑）
ignoreUntil = 2027-06-30
reason = "同上：dev-only，不进 --no-dev 镜像"

