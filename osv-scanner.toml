# =============================================================================
# OSV 依赖漏洞门禁 —— 白名单（B8）
#
# 用途：CI 的 `deps-scan` job 对 src/composer.lock 与 test/package-lock.json 跑
#       osv-scanner。**不在本文件里的**漏洞会让 CI 失败（退出非 0），
#       本文件里的（IgnoredVulns）会被过滤掉并在日志里打印「...filtered out because: <reason>」。
#
# 维护规则：
#   · 只白名单「我们明确接受」的告警，每条都要写清 reason 与 ignoreUntil（复审日期）。
#   · `ignoreUntil` 到期后该条不再生效（漏洞会重新报出来），逼你复审 —— 别当永久豁免。
#   · 清单一旦变化（升级依赖 / 上游发新公告），CI 会红；那时要么修依赖，要么按下面格式加条目。
#   · 白名单条目的 id 用 GHSA-…（osv-scanner 会把 CVE 等别名一并归到 GHSA 上）。
#
# 本文件内容 = 2026-09-30 真实扫描（osv-scanner v2.2.2）得到的全部命中，
# 逐条评估后接受；详见各条 reason。如何「修掉」而不是「白名单」见各组注释。
# =============================================================================

# -----------------------------------------------------------------------------
# 1) laravel/framework 9.52.22 —— 生产依赖（会进镜像），Laravel 9 已 EOL
#    上游修复只落在 10.x / 11.x / 12.x / 13.x（见各条 fixed 版本），9.x 线拿不到补丁。
#    真正升级 = 跨大版本重写应用，不在「只维护镜像」的范围内；接受。
#    想根治：升到 laravel/framework 12.x 线（需同步改 src/ 应用代码）。
# -----------------------------------------------------------------------------
