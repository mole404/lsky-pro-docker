<svg xmlns="http://www.w3.org/2000/svg" width="96" height="96" viewBox="0 0 96 96">
    <!-- fork：全站唯一默认头像（本地资源）。全站没有换头像功能，所有用户都是这一个图标。
         它由 <img src="..."> 引入，因此不能用 CSS 变量 / currentColor（外部 SVG 文档里
         currentColor 会解析成默认黑，暗色主题下等于隐形）——只能写死一个颜色。
         #7d8794 是刻意挑的中间灰：浅色底(bg-surface-2 #fafbfc)上对比度 3.52:1，
         暗色底(#1b2027)上 4.50:1，两边都过 WCAG 图形元素要求的 3:1。
         背景保持透明（两套主题共用同一个灰）。
         形状：头 + 身体两个圆，整体 clip 进外圆 —— 旧版身体是「半圆 + 平底」路径，
         平底两端在 28px 下呈两个尖角，这里改成整圆后底部由外圆弧收边，圆润无角。 -->
    <defs>
        <clipPath id="avatar-clip"><circle cx="48" cy="48" r="48"/></clipPath>
    </defs>
    <!-- 2026-10-05：人形整体放大（头 r16→r20、身体改成大椭圆 rx52 ry42 底部交给外圈裁切）。
         原因：原来人形只占画布 58%，在顶栏 28px 胶囊里「可见左缘」离胶囊左缘 = 12(内边距)+5.8(图留白) ≈ 18px，
         而旁边的存储策略胶囊图标几乎填满格子（≈13px），两个胶囊看着就不齐（老师反馈）。
         放大后人形可见左右缘离画布边约 7/96 ≈ 2px(28px 下)，可见左缘 ≈ 14px，与策略胶囊一致。
         形状仍是「头 + 身体」两个实心块、底部由外圆弧收边（不回退到旧的平底尖角）。 -->
    <g clip-path="url(#avatar-clip)">
        <circle cx="48" cy="30" r="20" fill="#7d8794"/>
        <ellipse cx="48" cy="96" rx="52" ry="42" fill="#7d8794"/>
    </g>
</svg>
